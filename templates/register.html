<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);

            color: #333;
        }
        .container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background: white
            ;
            border-radius: 15px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #0073e6;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input, select {
            width: 95%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            background: #0073e6;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }
        button:hover {
            background: #005bb5;
        }
        .back-button {
            display: inline-block;
            margin-top: 15px;
            color: #0073e6;
            text-decoration: none;
            font-weight: bold;
        }
        .back-button:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Patient Registration</h2>
        <form method="POST">
            <input type="text" placeholder="Full Name" id="name" name="name" required>
            <input type="number" placeholder="Age" id="age" name="age" required min="1" max="120">
            <select id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
            <input type="tel" placeholder="Contact Number" id="mobile_number" name="mobile_number" required pattern="[0-9]{10}" title="Please enter a valid 10-digit mobile number">
            <input type="email" placeholder="Email Address" id="email" name="email" required>
            <input type="password" placeholder="Create Password" id="password" name="password" required minlength="8">
            <input type="password" placeholder="Confirm Password" id="confirm_password" name="confirm_password" required minlength="8">
            <button type="submit">Register</button>
        </form>
        <a href="/Landingpage" class="back-button">Back to Home</a>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'Registering...';

            try {
                const formData = new FormData(this);
                const response = await fetch(this.action, {
                    method: 'POST',
                    body: formData
                });

                if (response.redirected) {
                    window.location.href = response.url;
                    return;
                }

                const data = await response.text();
                
                try {
                    const jsonData = JSON.parse(data);
                    if (jsonData.success) {
                        alert('Registration successful! Redirecting to login...');
                        window.location.href = '/login';
                    } else {
                        alert(jsonData.error || 'Registration failed. Please try again.');
                    }
                } catch (e) {
                    // If the response is not JSON, it's likely a redirect
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('Registration error:', error);
                alert('An error occurred. Please try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Register';
            }
        });
    </script>
</body>
</html>
